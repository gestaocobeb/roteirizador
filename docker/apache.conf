# Apenas public/ é exposto pelo Apache (requisito CDP).
<VirtualHost *:80>
    DocumentRoot /var/www/roteirizador/public

    <Directory /var/www/roteirizador>
        Require all denied
    </Directory>

    <Directory /var/www/roteirizador/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
